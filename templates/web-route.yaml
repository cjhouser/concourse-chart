{{- if .Values.web.enabled -}}
{{- if .Values.web.route.enabled -}}
{{- $route := .Values.web.route -}}
{{- $releaseName := .Release.Name -}}
{{- $serviceName := include "concourse.web.fullname" . -}}
{{- $servicePort := ternary .Values.concourse.web.tls.bindPort .Values.concourse.web.bindPort (and .Values.concourse.web.tls.enabled .Values.web.route.tls.enabled) -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ template "concourse.web.fullname" . }}
  labels:
    app: {{ template "concourse.web.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
  {{- with $route.labels }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if and $route.parentRefs (gt (len $route.parentRefs) 0) }}
  parentRefs:
  {{- toYaml $route.parentRefs | nindent 2 }}
  {{- end }}
  {{- if and $route.hostnames (gt (len $route.hostnames) 0) }}
  hostnames:
  {{- toYaml $route.hostnames | nindent 2 }}
  {{- end }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ $serviceName }}
      port: {{ $servicePort }}
      namespace: {{ .Release.Namespace | quote }}
{{- if and .Values.concourse.web.tls.enabled .Values.web.route.tls.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ template "concourse.web.fullname" . }}
spec:
  targetRefs:
  - kind: Service
    name: {{ template "concourse.web.fullname" . }}
    sectionName: {{ $servicePort }}
  validation:
    {{- if .Values.concourse.web.letsEncrypt.enabled }}
    wellKnownCACertificates: System
    hostname: {{ (urlParse .Values.concourse.web.externalUrl).host }}
    {{- else }}
    caCertificateRefs:
    - kind: ConfigMap
      name: {{ .Values.web.route.tls.trustStore }}
    hostname: {{ include "concourse.web.fullname" . | lower }}
    {{- end }}
{{- end }}
{{- end -}}
{{- end -}}
