{{- if .Values.web.enabled -}}
{{- if or .Values.concourse.web.auth.mainTeam.config .Values.concourse.web.configRBAC .Values.concourse.web.baseResourceTypeDefaults .Values.concourse.web.customHttpHeaders .Values.web.trust.bundle -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "concourse.web.fullname" . }}
  labels:
    app: {{ template "concourse.web.fullname" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: "{{ .Release.Name }}"
    heritage: "{{ .Release.Service }}"
data:
  {{- if .Values.concourse.web.auth.mainTeam.config }}
  main-team.yml: {{ .Values.concourse.web.auth.mainTeam.config | quote }}
  {{- end -}}
  {{- if .Values.concourse.web.configRBAC }}
  config-rbac.yml: {{ .Values.concourse.web.configRBAC | quote }}
  {{- end -}}
  {{- if .Values.concourse.web.baseResourceTypeDefaults }}
  brt-defaults.yml: {{ .Values.concourse.web.baseResourceTypeDefaults | quote }}
  {{- end -}}
  {{- if .Values.concourse.web.customHttpHeaders }}
  custom-http-headers.yml: {{ .Values.concourse.web.customHttpHeaders | quote }}
  {{- end -}}
  {{- if .Values.web.trust.bundle }}
  ca.crt: {{ .Values.web.trust.bundle }}
  {{- end -}}
  {{- if .Values.concourse.web.tls.caCert }}
  client-ca.crt: {{ .Values.concourse.web.tls.caCert }}
  {{- end -}}
{{- end -}}
{{- end -}}
